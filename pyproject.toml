[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drop-restorer"
version = "0.1.0"
description = "Local browser-based Wayback to WordPress restoration with visual approval"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "PySide6>=6.10,<6.12",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "lxml>=6,<7",
  "Pillow>=12,<13",
  "Flask>=3.1,<4",
  "langcodes>=3.5,<4",
  "tinycss2>=1.4,<2",
]

[project.gui-scripts]
drop-restorer = "drop_restorer.app:main"

[tool.setuptools.packages.find]
include = ["drop_restorer*"]

[tool.setuptools.package-data]
drop_restorer = ["templates/*", "web/templates/*", "web/static/*"]
